<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jarvis</title>
    <style>
      :root {
        --accent: 45, 125, 155;
        --orb-min: 96px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
        color: #cfe3ee;
        user-select: none;
      }

      /* The stage fills the window and sticks its contents to one corner */
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 10px;
        pointer-events: none;
      }
      #stage[data-corner^="bottom"] {
        justify-content: flex-end;
      }
      #stage[data-corner^="top"] {
        justify-content: flex-start;
      }
      #stage[data-corner$="right"] {
        align-items: flex-end;
      }
      #stage[data-corner$="left"] {
        align-items: flex-start;
      }
      #stage[data-mode="expanded"] {
        --orb: 210px;
      }
      #stage[data-mode="minimized"] {
        --orb: var(--orb-min);
        padding: calc(var(--orb-min) * 0.45 + 4px);
      }
      #stage[data-mode="expanded"] #dock {
        display: none;
      }
      #stage[data-mode="minimized"] #card {
        display: none;
      }
      .hit {
        pointer-events: auto;
      }

      /* The orb. Its canvas is bigger than the box so the ribbons and drops can float outside it */
      #orbBox {
        position: relative;
        width: var(--orb);
        height: var(--orb);
        flex: none;
        cursor: pointer;
      }
      #orbCanvas {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--orb) * 2.09);
        height: calc(var(--orb) * 2.09);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* The glass: a bright rim that fades from white through a little pink and blue, like the orb's edge */
      #card::before,
      #bubble::before,
      #menu::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.5px;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.85),
          rgba(150, 210, 255, 0.22) 28%,
          rgba(255, 130, 210, 0.3) 62%,
          rgba(255, 255, 255, 0.55)
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      /* The full panel */
      #card {
        position: relative;
        width: 340px;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 8px 16px 16px;
        border-radius: 28px;
        background:
          radial-gradient(
            130% 70% at 12% -8%,
            rgba(255, 255, 255, 0.2),
            transparent 55%
          ),
          linear-gradient(
            160deg,
            rgba(255, 255, 255, 0.1),
            rgba(255, 255, 255, 0.02) 40%,
            rgba(var(--accent), 0.1)
          ),
          rgba(8, 14, 22, 0.58);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -24px 48px rgba(var(--accent), 0.08),
          0 18px 44px rgba(0, 0, 0, 0.45);
        animation: cardIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.97);
        }
      }

      /* A glow in the state color that breathes. It only fades in and out, so it costs almost nothing. */
      #card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow: 0 0 44px rgba(var(--accent), 0.34);
        opacity: 0.45;
        animation: breathe 5s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 1;
        }
      }
      #stage[data-state="speaking"] #card::after {
        animation-duration: 1.6s;
      }
      #stage[data-state="alarm"] #card::after,
      #stage[data-state="error"] #card::after {
        animation-duration: 0.9s;
      }

      #bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
      }
      #stateLabel {
        font:
          700 11px Consolas,
          monospace;
        letter-spacing: 0.12em;
        color: rgb(var(--accent));
      }
      .icons {
        display: flex;
        gap: 4px;
      }
      .icons button {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: none;
        background: transparent;
        color: rgba(var(--accent), 0.95);
        border-radius: 8px;
        cursor: pointer;
      }
      .icons button:hover {
        background: rgba(var(--accent), 0.18);
      }
      #cardOrbSlot {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 0;
      }

      #texts {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 0;
      }
      .who {
        font:
          700 10px Consolas,
          monospace;
        letter-spacing: 0.12em;
        color: rgba(var(--accent), 0.85);
        margin-top: 8px;
      }
      #userText,
      #jarvisText,
      #bubbleInner {
        font:
          13px/1.45 Consolas,
          monospace;
        white-space: pre-wrap;
      }
      #userText {
        color: #d5e2ec;
        max-height: calc(1.45em * 4);
        overflow: hidden;
      }
      #jarvisText {
        color: color-mix(in srgb, rgb(var(--accent)) 60%, white);
        max-height: 200px;
        overflow-y: auto;
      }
      #jarvisText::-webkit-scrollbar {
        width: 6px;
      }
      #jarvisText::-webkit-scrollbar-thumb {
        background: rgba(var(--accent), 0.4);
        border-radius: 3px;
      }
      .empty {
        opacity: 0.4;
      }
      .typing::after {
        content: "\258C";
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* Minimized: the orb with its thought bubble beside it, on the side facing the middle of the screen */
      #dock {
        display: flex;
        flex-direction: row;
        gap: 10px;
      }
      #stage[data-corner$="right"] #dock {
        flex-direction: row-reverse;
      }
      #stage[data-corner^="bottom"] #dock {
        align-items: flex-end;
      }
      #stage[data-corner^="top"] #dock {
        align-items: flex-start;
      }
      #dockSlot {
        display: flex;
        flex: none;
      }
      #bubble {
        position: relative;
        width: 250px;
        padding: 10px 14px;
        border-radius: 18px;
        background:
          radial-gradient(
            120% 90% at 10% -10%,
            rgba(255, 255, 255, 0.18),
            transparent 60%
          ),
          rgba(8, 14, 22, 0.66);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.25),
          0 10px 30px rgba(0, 0, 0, 0.4),
          0 0 24px rgba(var(--accent), 0.16);
        opacity: 0;
        transform: scale(0.96);
        transition:
          opacity 0.25s,
          transform 0.25s;
        pointer-events: none;
        cursor: pointer;
      }
      #bubble.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      #bubbleInner {
        max-height: calc(1.45em * 4);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        color: color-mix(in srgb, rgb(var(--accent)) 60%, white);
      }
      #bubble::after {
        content: "";
        position: absolute;
        bottom: 22px;
        width: 10px;
        height: 10px;
        background: #0d1822;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        transform: rotate(45deg);
      }
      #stage[data-corner$="right"] #bubble::after {
        right: -6px;
        border-left: none;
        border-bottom: none;
      }
      #stage[data-corner$="left"] #bubble::after {
        left: -6px;
        border-right: none;
        border-top: none;
      }
      #stage[data-corner^="top"] #bubble::after {
        bottom: auto;
        top: 22px;
      }

      /* Right-click menu */
      #menuShield {
        position: fixed;
        inset: 0;
        display: none;
      }
      #menuShield.open {
        display: block;
      }
      #menu {
        position: fixed;
        min-width: 180px;
        padding: 6px;
        border-radius: 14px;
        display: none;
        background:
          radial-gradient(
            120% 90% at 10% -10%,
            rgba(255, 255, 255, 0.14),
            transparent 60%
          ),
          rgba(10, 17, 26, 0.92);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 14px 36px rgba(0, 0, 0, 0.5);
      }
      #menu.open {
        display: block;
      }
      #menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #cfe3ee;
        font:
          13px "Segoe UI",
          sans-serif;
        cursor: pointer;
      }
      #menu button:hover {
        background: rgba(var(--accent), 0.2);
      }
      #menu hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        margin: 4px 0;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "./node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div
      id="stage"
      data-mode="expanded"
      data-corner="bottom_right"
      data-state="idle"
    >
      <div id="card" class="hit" data-drag>
        <div id="bar">
          <span id="stateLabel">IDLE</span>
          <span class="icons">
            <button id="btnSettings" title="Settings">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              >
                <circle cx="8" cy="8" r="2.6" />
                <path
                  d="M8 1.2v2M8 12.8v2M1.2 8h2M12.8 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"
                />
              </svg>
            </button>
            <button id="btnMin" title="Minimize">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              >
                <path d="M3 8h10" />
              </svg>
            </button>
          </span>
        </div>

        <div id="cardOrbSlot">
          <div id="orbBox" class="hit" data-drag>
            <canvas id="orbCanvas"></canvas>
          </div>
        </div>

        <div id="texts">
          <div class="who">YOU</div>
          <div id="userText" class="empty">...</div>
          <div class="who">JARVIS</div>
          <div id="jarvisText" class="empty">
            Click the orb, then press D for a demo.
          </div>
        </div>
      </div>

      <div id="dock">
        <div id="dockSlot"></div>
        <div id="bubble" class="hit"><div id="bubbleInner"></div></div>
      </div>
    </div>

    <div id="menuShield" class="hit"></div>
    <div id="menu" class="hit">
      <button data-act="toggle" id="menuToggle">Minimize</button>
      <button data-act="settings">Settings...</button>
      <button data-act="stop">Stop him</button>
      <hr />
      <button data-act="quit">Quit Jarvis</button>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
