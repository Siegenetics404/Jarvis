<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jarvis panel settings</title>
    <style>
      :root {
        --accent: 0, 229, 255;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font:
          13px "Segoe UI",
          sans-serif;
        color: #cfe3ee;
        user-select: none;
      }
      body {
        padding: 16px;
      }

      /* The glass sheet, same as the panel */
      #sheet {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        border-radius: 28px;
        background:
          radial-gradient(
            130% 55% at 12% -6%,
            rgba(255, 255, 255, 0.2),
            transparent 55%
          ),
          linear-gradient(
            160deg,
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.02) 40%,
            rgba(var(--accent), 0.1)
          ),
          rgba(8, 14, 22, 0.92);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -24px 48px rgba(var(--accent), 0.07),
          0 18px 44px rgba(0, 0, 0, 0.5),
          0 0 34px rgba(var(--accent), 0.16);
        animation: in 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
      }
      #sheet::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.5px;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.85),
          rgba(150, 210, 255, 0.22) 28%,
          rgba(255, 130, 210, 0.3) 62%,
          rgba(255, 255, 255, 0.55)
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      /* The header is the handle for moving the window */
      #head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        padding: 0 16px 0 24px;
        -webkit-app-region: drag;
      }
      #title {
        font:
          600 15px "Segoe UI",
          sans-serif;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #title svg {
        color: rgb(var(--accent));
        filter: drop-shadow(0 0 6px rgba(var(--accent), 0.7));
      }
      #x {
        -webkit-app-region: no-drag;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: rgba(var(--accent), 0.95);
        cursor: pointer;
      }
      #x:hover {
        background: rgba(var(--accent), 0.2);
      }

      #body {
        flex: 1;
        overflow-y: auto;
        padding: 0 24px 6px;
      }
      #body::-webkit-scrollbar {
        width: 6px;
      }
      #body::-webkit-scrollbar-thumb {
        background: rgba(var(--accent), 0.4);
        border-radius: 3px;
      }
      .row {
        margin-top: 18px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      label.cap {
        font-size: 12px;
        color: #9fb6c5;
        letter-spacing: 0.02em;
      }
      .val {
        font:
          12px Consolas,
          monospace;
        color: rgb(var(--accent));
      }

      select {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        color: #cfe3ee;
        font:
          13px "Segoe UI",
          sans-serif;
        padding: 9px 36px 9px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.07)
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none' stroke='%239fb6c5' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.5l5 5 5-5'/></svg>")
          no-repeat right 14px center;
      }
      select:hover {
        border-color: rgba(var(--accent), 0.55);
      }
      select:focus-visible {
        outline: none;
        border-color: rgb(var(--accent));
        box-shadow: 0 0 0 3px rgba(var(--accent), 0.22);
      }
      select option {
        background: #0e1a25;
        color: #cfe3ee;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 22px;
        background: transparent;
        margin: 0;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          rgba(var(--accent), 0.9) var(--fill, 50%),
          rgba(255, 255, 255, 0.14) var(--fill, 50%)
        );
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -6px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 28%,
          #ffffff,
          rgb(var(--accent)) 75%
        );
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.55),
          0 0 12px rgba(var(--accent), 0.7);
      }
      input[type="range"]:focus-visible {
        outline: none;
      }
      input[type="range"]:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 4px rgba(var(--accent), 0.3);
      }

      .switch {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 18px;
        cursor: pointer;
      }
      .switch input {
        display: none;
      }
      .track {
        position: relative;
        flex: none;
        width: 40px;
        height: 22px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.14);
        transition: background 0.2s;
      }
      .track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #dfeaf1;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .switch input:checked + .track {
        background: rgba(var(--accent), 0.75);
        box-shadow: 0 0 14px rgba(var(--accent), 0.4);
      }
      .switch input:checked + .track::after {
        transform: translateX(18px);
        background: #ffffff;
      }

      #foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 24px 22px;
      }
      .btn {
        padding: 9px 22px;
        border-radius: 999px;
        font:
          13px "Segoe UI",
          sans-serif;
        cursor: pointer;
        color: #cfe3ee;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
      }
      .btn:hover {
        background: rgba(var(--accent), 0.22);
        border-color: rgba(var(--accent), 0.6);
      }
      .btn.main {
        background: rgba(var(--accent), 0.3);
        border-color: rgba(var(--accent), 0.65);
        color: #ffffff;
      }
      .btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(var(--accent), 0.3);
      }
    </style>
  </head>
  <body>
    <div id="sheet">
      <div id="head">
        <span id="title">
          <svg
            data-gear
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
            stroke-linecap="round"
          ></svg>
          Panel settings
        </span>
        <button id="x" title="Close" aria-label="Close">
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M2 2l10 10M12 2L2 12" />
          </svg>
        </button>
      </div>

      <div id="body">
        <div class="row">
          <div class="top">
            <label class="cap" for="alpha">Transparency</label
            ><span class="val" id="vAlpha"></span>
          </div>
          <input id="alpha" type="range" min="40" max="100" />
        </div>

        <div class="row">
          <div class="top">
            <label class="cap" for="corner">Position</label>
          </div>
          <select id="corner">
            <option value="bottom_right">Bottom right</option>
            <option value="bottom_left">Bottom left</option>
            <option value="top_right">Top right</option>
            <option value="top_left">Top left</option>
            <option value="custom" disabled>Custom (dragged)</option>
          </select>
        </div>

        <div class="row">
          <div class="top"><label class="cap" for="orb">Orb size</label></div>
          <select id="orb">
            <option value="72">Small</option>
            <option value="96">Medium</option>
            <option value="130">Large</option>
          </select>
        </div>

        <div class="row">
          <div class="top">
            <label class="cap" for="theme">Color theme</label>
          </div>
          <select id="theme">
            <option value="arc">Arc blue</option>
            <option value="emerald">Emerald</option>
            <option value="violet">Violet</option>
            <option value="silver">Silver</option>
          </select>
        </div>

        <div class="row">
          <div class="top">
            <label class="cap" for="talk">When he talks while minimized</label>
          </div>
          <select id="talk">
            <option value="bubble">Show a thought bubble</option>
            <option value="open">Open the panel</option>
            <option value="none">Do nothing</option>
          </select>
        </div>

        <div class="row">
          <div class="top">
            <label class="cap" for="bubble">Keep the bubble for</label
            ><span class="val" id="vBubble"></span>
          </div>
          <input id="bubble" type="range" min="1" max="15" />
        </div>

        <div class="row">
          <div class="top">
            <label class="cap" for="tuck">Tuck an opened panel away after</label
            ><span class="val" id="vTuck"></span>
          </div>
          <input id="tuck" type="range" min="0" max="120" />
        </div>

        <label class="switch"
          ><input id="startMin" type="checkbox" /><span class="track"></span
          ><span>Start as a small orb</span></label
        >
        <label class="switch"
          ><input id="top" type="checkbox" /><span class="track"></span
          ><span>Always on top</span></label
        >
      </div>

      <div id="foot">
        <button class="btn" id="reset">Reset</button>
        <button class="btn main" id="close">Close</button>
      </div>
    </div>

    <script src="./gear.js"></script>
    <script>
      const api = window.jarvis;
      const $ = (id) => document.getElementById(id);
      const D = {
        alpha: 0.9,
        corner: "bottom_right",
        orb_size: 96,
        theme: "arc",
        talk_mode: "bubble",
        bubble_seconds: 4,
        tuck_seconds: 20,
        start_minimized: false,
        always_on_top: true,
      };
      const ACCENT = {
        arc: "0, 229, 255",
        emerald: "60, 235, 140",
        violet: "190, 140, 255",
        silver: "235, 240, 245",
      };
      let S = { ...D };

      function paintRange(el) {
        const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
        el.style.setProperty("--fill", pct + "%");
      }
      function show() {
        $("vAlpha").textContent = Math.round(S.alpha * 100) + "%";
        $("vBubble").textContent = S.bubble_seconds + " s";
        $("vTuck").textContent = S.tuck_seconds
          ? S.tuck_seconds + " s"
          : "never";
        document.documentElement.style.setProperty(
          "--accent",
          ACCENT[S.theme] || ACCENT.arc,
        );
        ["alpha", "bubble", "tuck"].forEach((id) => paintRange($(id)));
      }
      function fill() {
        $("alpha").value = Math.round(S.alpha * 100);
        $("corner").value = S.corner;
        $("orb").value = String(S.orb_size);
        $("theme").value = S.theme;
        $("talk").value = S.talk_mode;
        $("bubble").value = S.bubble_seconds;
        $("tuck").value = S.tuck_seconds;
        $("startMin").checked = !!S.start_minimized;
        $("top").checked = S.always_on_top !== false;
        show();
      }
      async function load() {
        S = { ...D, ...(await api.loadSettings()) };
        fill();
      }

      // every change goes straight to the panel, so you see it happen
      function change(key, value) {
        S[key] = value;
        show();
        api.updateSettings({ [key]: value });
      }

      $("alpha").addEventListener("input", (e) =>
        change("alpha", e.target.value / 100),
      );
      $("corner").addEventListener("change", (e) =>
        change("corner", e.target.value),
      );
      $("orb").addEventListener("change", (e) =>
        change("orb_size", Number(e.target.value)),
      );
      $("theme").addEventListener("change", (e) =>
        change("theme", e.target.value),
      );
      $("talk").addEventListener("change", (e) =>
        change("talk_mode", e.target.value),
      );
      $("bubble").addEventListener("input", (e) =>
        change("bubble_seconds", Number(e.target.value)),
      );
      $("tuck").addEventListener("input", (e) =>
        change("tuck_seconds", Number(e.target.value)),
      );
      $("startMin").addEventListener("change", (e) =>
        change("start_minimized", e.target.checked),
      );
      $("top").addEventListener("change", (e) =>
        change("always_on_top", e.target.checked),
      );
      $("reset").addEventListener("click", () => api.resetSettings());
      $("close").addEventListener("click", () => api.closeSettings());
      $("x").addEventListener("click", () => api.closeSettings());
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") api.closeSettings();
      });
      api.onSettingsRefresh(load);

      load();
    </script>
  </body>
</html>
